# This single file replaces both ci.yml and deploy.yml
# It ensures a robust, sequential build-then-deploy process
name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - organize-project
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/medoptix-api

jobs:
  #########################################
  #      CONTINUOUS INTEGRATION JOB       #
  #########################################
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run tests with Pytest
      #   run: pytest # <-- NOTE: Tests are temporarily disabled. Uncomment this section when tests are added.

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: image
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Force rebuild without cache to ensure latest code
          no-cache: true

  #########################################
  #      CONTINUOUS DEPLOYMENT JOB      #
  #########################################
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build # <-- CRITICAL: This ensures deployment only runs after a successful build
    steps:
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the application directory
            cd medoptix-ai-internship

            echo "--- Setting environment variables ---"
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            echo "--- Tearing down old services ---"
            docker-compose down --rmi all

            echo "--- Pulling latest image from Docker Hub ---"
            docker pull ${{ secrets.DOCKER_USERNAME }}/medoptix-api:latest

            echo "--- Starting new services with fresh image ---"
            docker-compose up -d --force-recreate --pull always

            # --- CRITICAL DEBUGGING STEP ---
            sleep 15
            echo "--- APPLICATION CONTAINER LOGS ---"
            docker-compose logs --tail="50"
            echo "----------------------------------"

            # Verify the container is actually running
            echo "--- CONTAINER STATUS ---"
            docker-compose ps
            echo "------------------------"

            # Check if the correct image is being used
            echo "--- CONTAINER IMAGE INFO ---"
            docker inspect $(docker-compose ps -q) | grep Image
            echo "-----------------------------"

            # Optional: Clean up old, unused Docker images to save space
            docker image prune -f

      - name: Verify Deployment Health
        run: |
          sleep 30 # Wait for the service to stabilize
          curl -fS https://sabisave.info/health || exit 1